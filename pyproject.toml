[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-recommendation-system"
version = "0.1.0"
description = "Script-based movie recommendation system using RAG over movie scripts."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "scripts*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
